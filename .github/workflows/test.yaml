name: ORF diagnostic

on: [push]

env:
  UV_TORCH_BACKEND: cpu

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  orf:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v3
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements.txt
            setup.py
      - name: Install dependencies
        run: |
          uv venv --python 3.12
          uv pip install "setuptools>=68.0" "wheel>=0.41"
          uv pip install -r requirements.txt
      - name: Environment
        run: |
          uv run python -c "import numpy, scipy, platform, os; print('numpy', numpy.__version__); print('scipy', scipy.__version__); print('platform', platform.platform()); print('machine', platform.machine()); print('cpus', os.cpu_count())"
          uv run python -c "import numpy; numpy.show_config()" || true
          cat /proc/cpuinfo | grep -m1 'model name' || true
      - name: Run the one test
        run: uv run python -m pytest "tests/test_lstar.py::TestLStarORF::test_no_orf_1" -s -q
