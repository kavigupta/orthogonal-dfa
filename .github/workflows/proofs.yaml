name: Lean proof

on:
  push:
    paths:
      - 'proofs/**'
      - '.github/workflows/proofs.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: proofs/OrthoDFA
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch prebuilt Mathlib
        run: lake exe cache get
      - name: Restore OrthoDFA's own build
        uses: actions/cache@v4
        with:
          path: proofs/OrthoDFA/.lake/build
          key: lean-build-${{ hashFiles('proofs/OrthoDFA/lean-toolchain', 'proofs/OrthoDFA/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lean-build-${{ hashFiles('proofs/OrthoDFA/lean-toolchain', 'proofs/OrthoDFA/lake-manifest.json') }}-
      - name: Build
        run: lake build 2>&1 | tee build.log
      - name: Elaborate Verify.lean afresh
        run: lake env lean OrthoDFA/Verify.lean 2>&1 | tee -a build.log
      - name: No sorry, and every claim rests on the core axioms alone
        run: |
          if grep -E "declaration uses .sorry." build.log; then
            echo "::error::a declaration uses sorry"; exit 1
          fi
          claims=$(grep -F "OrthoDFA/Verify.lean" build.log | grep -F "depends on axioms")
          [ -n "$claims" ] || { echo "::error::Verify.lean printed no axioms"; exit 1; }
          if echo "$claims" | sed 's/.*depends on axioms: \[\(.*\)\]/\1/' | tr ',' '\n' \
              | tr -d ' ' | grep -vxE "propext|Classical\.choice|Quot\.sound"; then
            echo "::error::a claim depends on more than the core axioms"; exit 1
          fi
