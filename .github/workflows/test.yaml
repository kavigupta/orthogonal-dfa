name: Python package

on: [push]

env:
  UV_TORCH_BACKEND: cpu

jobs:
  counted-pattern:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v3
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements.txt
            setup.py
      - name: Install dependencies
        run: |
          uv venv --python 3.12
          uv pip install "setuptools>=68.0" "wheel>=0.41"
          uv pip install -r requirements.txt
      - name: Run the counted pattern
        run: uv run python -m pytest "tests/test_lstar.py::TestCountedPattern" -sv
