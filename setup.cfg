[metadata]
description-file = README.md
name = orthogonal-dfa
version = 0.0.1
author = Kavi Gupta

[tool:pytest]
markers =
    slow: a test whose search has a long tail, given a shard and a clock of its own
# A test that stops making progress otherwise runs out its shard's clock, which
# reports the shard and not the test.  The slowest test on a green run is under
# three minutes, so this is loose enough to leave the long tails alone.
timeout = 600
